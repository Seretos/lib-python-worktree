name: tests

# Runs pytest on every PR only (no `push` trigger). `pull_request` builds
# and tests `refs/pull/N/merge`, a preview of the PR head merged into its
# base as of the last sync -- not the head commit alone, and not the SHA
# that ultimately lands (a squash-merge produces a different SHA); it can
# also go stale if the base moves after the last sync. Commits landing
# directly on `main` are consequently not built either. Accepted trade-off
# of ticket #116, chosen so a failing run always appears where someone
# will act on it -- the PR -- rather than duplicated per SHA. Distinct
# from release.yml which is workflow_dispatch-driven and produces the
# release-branch + tag.
#
# Matrix: windows-latest + ubuntu-22.04. The 22.04 pin (not
# ubuntu-latest) matches the WSL2 / plugin-binary glibc target, so a
# regression here would be visible to the same downstream consumers.
on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package + test deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pytest
        shell: pwsh
        run: python -m pytest --cov=lib_python_worktree --cov-report=term-missing --cov-fail-under=80
