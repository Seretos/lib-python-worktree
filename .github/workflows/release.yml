name: release

# Manual lib-release flow. Analogous to the plugin's release.yml but
# without the binary build (libs ship as Python source distributions
# pulled by downstream consumers via `git+https://.../@vX.Y.Z` or
# `@release/Nx`). Topology:
#
#   stamp+publish (ubuntu-22.04) -> validates semver, fails on
#                                   duplicate tag, stamps pyproject.toml
#                                   with the requested version on a
#                                   fresh release branch built off main,
#                                   tags the stamp commit as vX.Y.Z,
#                                   force-pushes release/Nx (the
#                                   floating branch downstream consumers
#                                   pin to), and creates the GitHub
#                                   Release. `main` is never touched --
#                                   the bot commit lives only on the
#                                   release/Nx branch.
#
# Release-branch policy:
#   release/0.x  -- all 0.x.y releases.   Force-pushed each release.
#   release/1.x  -- all 1.x.y releases.   Created the first time a 1.x.y
#                   release is published; force-pushed each release after.
#   release/Nx   -- analogous.
#
# Past tags remain reachable via `git+https://.../@vX.Y.Z` even after
# a force-push because the commit they point to is preserved by git as
# long as the tag exists.
#
# The downstream consumer is the agent-worktree MCP plugin, which wraps
# this engine. A release here opens a dependency-update ticket there.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 5

    steps:
      - name: Validate version is semver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$V' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE])."
            exit 1
          fi

      - name: Check tag does not yet exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Delete it first or pick a new version."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute release-branch name
        id: branch
        shell: bash
        run: |
          V="${{ inputs.version }}"
          MAJOR=$(echo "$V" | cut -d. -f1)
          BRANCH="release/${MAJOR}.x"
          echo "name=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "Will publish to ${BRANCH}"

      - name: Stamp pyproject.toml, commit, tag, force-push release branch
        # Stamp via sed (POSIX, no extra tools), anchored to start of
        # line to avoid touching nested versions in tool tables. The
        # stamp commit lives only on the release/Nx branch -- main
        # stays at whatever HEAD it was before this workflow ran.
        shell: bash
        run: |
          V="${{ inputs.version }}"
          TAG="v${V}"
          BRANCH="${{ steps.branch.outputs.name }}"

          sed -i -E 's/^(version[[:space:]]*=[[:space:]]*")[^"]*(")/\1'"$V"'\2/' pyproject.toml
          grep -E "^version[[:space:]]*=[[:space:]]*\"$V\"" pyproject.toml \
            || { echo "::error::pyproject.toml stamp failed"; exit 1; }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Build the release branch fresh from main HEAD each time.
          # Past tags pin past commits -- they are independent of where
          # the release/Nx pointer currently sits.
          git checkout -B "$BRANCH"
          git add pyproject.toml
          git commit -m "release: ${TAG}"

          git tag -a "$TAG" -m "${TAG}"

          git push origin "$BRANCH" --force
          git push origin "$TAG"

      - name: Create GitHub Release
        # PREV_TAG: each release branch is force-pushed fresh off main and
        # the stamp commit is never merged back, so no prior vX.Y.Z tag is
        # ever an ancestor of the newly created tag -- `gh`'s ancestor-walk
        # auto-detect for --generate-notes therefore finds nothing and
        # would otherwise generate notes from the beginning of history.
        # prev_release_tag.py computes the actual previous released tag by
        # real semver precedence so it can be passed explicitly.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          PRE_FLAG=""
          if [[ "${{ inputs.version }}" == *-* ]]; then
            PRE_FLAG="--prerelease"
          fi

          # `git tag --list` sees all historical tags here because
          # "Checkout main" above already ran with fetch-depth: 0.
          PREV_TAG=$(git tag --list 'v*' | python3 .github/scripts/prev_release_tag.py "${{ inputs.version }}")
          NOTES_START=""
          if [ -z "$PREV_TAG" ]; then
            echo "::warning::No previous release tag found; notes will span full history."
          else
            NOTES_START="--notes-start-tag $PREV_TAG"
          fi

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            $NOTES_START \
            $PRE_FLAG

      - name: Fetch release notes for the bump ticket body
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          CHANGELOG_FILE="${RUNNER_TEMP}/bump-changelog.md"

          NOTES=$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json body --jq .body 2>/dev/null || true)

          if [ "${#NOTES}" -gt 30000 ]; then
            NOTES="${NOTES:0:30000}

          _(release notes truncated at 30000 characters; see the full release page.)_"
          fi

          if [ -z "$NOTES" ]; then
            echo "::warning::Could not fetch release notes for ${TAG}; falling back to a release link."
            printf 'See the [release notes for %s](https://github.com/%s/releases/tag/%s).\n' \
              "$TAG" "${{ github.repository }}" "$TAG" > "$CHANGELOG_FILE"
          else
            printf '%s\n' "$NOTES" > "$CHANGELOG_FILE"
          fi

          echo "CHANGELOG_FILE=${CHANGELOG_FILE}" >> "$GITHUB_ENV"

      - name: Open dependency-update ticket in Seretos/agent-worktree
        # continue-on-error: a missing/invalid WORKTREE_TICKET_TOKEN must
        # never fail the release itself.
        id: file_worktree
        continue-on-error: true
        shell: bash
        # TITLE/BODY_HEAD/BODY_TAIL live in env (not a run-block heredoc): a
        # heredoc body at column 0 dedents out of the YAML block scalar and
        # breaks the file. A YAML block scalar holds the markdown verbatim
        # and ${{ }} still expands. Bash just references
        # "$TITLE"/"$BODY_HEAD"/"$BODY_TAIL". The body is split around the
        # fetched "### What changed" changelog section, composed at run time
        # into a temp file and passed via --body-file (a single env string
        # cannot embed the fetched changelog content read from disk).
        env:
          GH_TOKEN: ${{ secrets.WORKTREE_TICKET_TOKEN }}
          TITLE: "chore(deps): bump lib-python-worktree to v${{ inputs.version }}"
          BODY_HEAD: |
            ## Dependency update

            A new release of **lib-python-worktree** has been published: `v${{ inputs.version }}`.
          BODY_TAIL: |
            ### Action required

            1. Update the pin in `pyproject.toml` to:
               ```
               lib-python-worktree @ git+https://github.com/Seretos/lib-python-worktree@v${{ inputs.version }}
               ```
            2. Run `pwsh scripts/test.ps1` to verify the test suite passes.
            3. Run `pwsh scripts/build.ps1` to confirm the build succeeds.
            4. Commit and open a PR.
        run: |
          CONSUMER="Seretos/agent-worktree"
          TAG="v${{ inputs.version }}"

          BODY_FILE="$(mktemp)"
          {
            printf '%s\n' "$BODY_HEAD"
            printf '### What changed\n\n'
            if [ -n "${CHANGELOG_FILE:-}" ] && [ -s "${CHANGELOG_FILE:-}" ]; then
              cat "$CHANGELOG_FILE"
            else
              printf 'See the [release notes for %s](https://github.com/%s/releases/tag/%s).\n' \
                "$TAG" "${{ github.repository }}" "$TAG"
            fi
            printf '\n'
            printf '%s\n' "$BODY_TAIL"
          } > "$BODY_FILE"

          # Idempotency: skip if an open issue with this exact title already
          # exists — reuse its URL instead of creating a duplicate.
          # --paginate follows all pages; jq filter excludes pull requests.
          ISSUE_URL=$(gh api --paginate "repos/${CONSUMER}/issues?state=open&per_page=100" \
            --jq --arg t "$TITLE" 'map(select((.pull_request|not) and (.title==$t))) | .[0].html_url // empty' 2>/dev/null || true)
          if [ -n "$ISSUE_URL" ]; then
            echo "Issue already exists in ${CONSUMER}, skipping."
          else
            # Attempt creation with the 'dependencies' label; fall back
            # without it if the label does not exist in the consumer repo.
            ISSUE_URL=$(gh issue create \
              --repo "$CONSUMER" \
              --title "$TITLE" \
              --body-file "$BODY_FILE" \
              --label dependencies \
            || gh issue create \
              --repo "$CONSUMER" \
              --title "$TITLE" \
              --body-file "$BODY_FILE")
            echo "Ticket opened in ${CONSUMER}: ${ISSUE_URL}"
          fi
          echo "issue_url=${ISSUE_URL}" >> "$GITHUB_OUTPUT"

      - name: Add agent-worktree ticket to project board
        # Reuses WORKTREE_TICKET_TOKEN: adding an item to a user-owned
        # Projects v2 board needs the `project` scope, which only a classic
        # PAT can carry alongside its `repo` scope (fine-grained PATs have no
        # Projects permission at all) — so this consumer's own ticket token
        # is used, no separate board secret required.
        if: steps.file_worktree.outputs.issue_url != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKTREE_TICKET_TOKEN }}
        run: |
          ISSUE_URL="${{ steps.file_worktree.outputs.issue_url }}"
          TOKEN_NAME="WORKTREE_TICKET_TOKEN"

          ITEM_ID=$(gh project item-add 2 --owner Seretos --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)
          if [ -z "$ITEM_ID" ]; then
            echo "::warning::Could not add ${ISSUE_URL} to project board 2 (check that ${TOKEN_NAME} is a classic PAT with the project scope)."
          else
            {
              PROJECT_ID=$(gh project view 2 --owner Seretos --format json --jq .id)
              FIELDS=$(gh project field-list 2 --owner Seretos --format json)
              FIELD_ID=$(printf '%s' "$FIELDS" | jq -r '.fields[] | select(.name=="Status") | .id')
              OPTION_ID=$(printf '%s' "$FIELDS" | jq -r '.fields[] | select(.name=="Status") | .options[] | select(.name=="Backlog") | .id')
              [ -n "$FIELD_ID" ] && [ -n "$OPTION_ID" ] || false
              gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
                --field-id "$FIELD_ID" --single-select-option-id "$OPTION_ID"
            } || echo "::warning::Could not move ${ISSUE_URL} to the Backlog column; card left in its default column."
          fi

      - name: Open dependency-update ticket in Seretos/workboard
        # continue-on-error: a missing/invalid WORKBOARD_TICKET_TOKEN must
        # never fail the release itself.
        id: file_workboard
        continue-on-error: true
        shell: bash
        # TITLE/BODY_HEAD/BODY_TAIL live in env (not a run-block heredoc): a
        # heredoc body at column 0 dedents out of the YAML block scalar and
        # breaks the file. A YAML block scalar holds the markdown verbatim
        # and ${{ }} still expands. Bash just references
        # "$TITLE"/"$BODY_HEAD"/"$BODY_TAIL". The body is split around the
        # fetched "### What changed" changelog section, composed at run time
        # into a temp file and passed via --body-file (a single env string
        # cannot embed the fetched changelog content read from disk).
        env:
          GH_TOKEN: ${{ secrets.WORKBOARD_TICKET_TOKEN }}
          TITLE: "chore(deps): bump lib-python-worktree to v${{ inputs.version }}"
          BODY_HEAD: |
            ## Dependency update

            A new release of **lib-python-worktree** has been published: `v${{ inputs.version }}`.
          BODY_TAIL: |
            ### Action required

            1. Update the pin in `pyproject.toml` to:
               ```
               lib-python-worktree @ git+https://github.com/Seretos/lib-python-worktree@v${{ inputs.version }}
               ```
            2. Run `pwsh scripts/test.ps1` to verify the test suite passes.
            3. Run `pwsh scripts/build.ps1` to confirm the build succeeds.
            4. Commit and open a PR.
        run: |
          CONSUMER="Seretos/workboard"
          TAG="v${{ inputs.version }}"

          BODY_FILE="$(mktemp)"
          {
            printf '%s\n' "$BODY_HEAD"
            printf '### What changed\n\n'
            if [ -n "${CHANGELOG_FILE:-}" ] && [ -s "${CHANGELOG_FILE:-}" ]; then
              cat "$CHANGELOG_FILE"
            else
              printf 'See the [release notes for %s](https://github.com/%s/releases/tag/%s).\n' \
                "$TAG" "${{ github.repository }}" "$TAG"
            fi
            printf '\n'
            printf '%s\n' "$BODY_TAIL"
          } > "$BODY_FILE"

          # Idempotency: skip if an open issue with this exact title already
          # exists — reuse its URL instead of creating a duplicate.
          # --paginate follows all pages; jq filter excludes pull requests.
          ISSUE_URL=$(gh api --paginate "repos/${CONSUMER}/issues?state=open&per_page=100" \
            --jq --arg t "$TITLE" 'map(select((.pull_request|not) and (.title==$t))) | .[0].html_url // empty' 2>/dev/null || true)
          if [ -n "$ISSUE_URL" ]; then
            echo "Issue already exists in ${CONSUMER}, skipping."
          else
            # Attempt creation with the 'dependencies' label; fall back
            # without it if the label does not exist in the consumer repo.
            ISSUE_URL=$(gh issue create \
              --repo "$CONSUMER" \
              --title "$TITLE" \
              --body-file "$BODY_FILE" \
              --label dependencies \
            || gh issue create \
              --repo "$CONSUMER" \
              --title "$TITLE" \
              --body-file "$BODY_FILE")
            echo "Ticket opened in ${CONSUMER}: ${ISSUE_URL}"
          fi
          echo "issue_url=${ISSUE_URL}" >> "$GITHUB_OUTPUT"

      - name: Add workboard ticket to project board
        # Reuses WORKBOARD_TICKET_TOKEN, which must be a classic PAT carrying
        # both `repo` and `project` scopes.
        if: steps.file_workboard.outputs.issue_url != ''
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WORKBOARD_TICKET_TOKEN }}
        run: |
          ISSUE_URL="${{ steps.file_workboard.outputs.issue_url }}"
          TOKEN_NAME="WORKBOARD_TICKET_TOKEN"

          ITEM_ID=$(gh project item-add 2 --owner Seretos --url "$ISSUE_URL" --format json --jq .id 2>/dev/null || true)
          if [ -z "$ITEM_ID" ]; then
            echo "::warning::Could not add ${ISSUE_URL} to project board 2 (check that ${TOKEN_NAME} is a classic PAT with the project scope)."
          else
            {
              PROJECT_ID=$(gh project view 2 --owner Seretos --format json --jq .id)
              FIELDS=$(gh project field-list 2 --owner Seretos --format json)
              FIELD_ID=$(printf '%s' "$FIELDS" | jq -r '.fields[] | select(.name=="Status") | .id')
              OPTION_ID=$(printf '%s' "$FIELDS" | jq -r '.fields[] | select(.name=="Status") | .options[] | select(.name=="Backlog") | .id')
              [ -n "$FIELD_ID" ] && [ -n "$OPTION_ID" ] || false
              gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" \
                --field-id "$FIELD_ID" --single-select-option-id "$OPTION_ID"
            } || echo "::warning::Could not move ${ISSUE_URL} to the Backlog column; card left in its default column."
          fi
