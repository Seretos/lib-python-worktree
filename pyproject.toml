[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lib-python-worktree"
version = "0.3.6"
description = "Git-worktree lifecycle + contract engine (create/list/remove, YAML setup contract, port allocation, setup-script runner, state persistence) for the Seretos agent-plugin ecosystem"
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "portalocker>=2.7",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-cov>=4",
  "pytest-timeout>=2.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# Per-test timeout (#90, #114): several tests spawn real OS
# processes/threads (process_lifecycle.py's _query_object_bounded /
# NtQueryObject on Windows) that are documented to wedge indefinitely
# at 0% CPU. `thread` (not `signal`) is chosen deliberately so the
# Windows and POSIX matrix legs behave identically, and on expiry it
# dumps thread stacks -- an accepted tradeoff, since that dump is how
# the original hang was diagnosed.
timeout = 90
timeout_method = "thread"
markers = [
  "requires_git: marks tests that invoke real git subprocesses (skipped if git is absent)",
]
